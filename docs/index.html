<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>BlendGen Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/vue.css">
  <script src="//unpkg.com/docsify-edit-on-github/index.js"></script>
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'BlendGen',
      repo: 'https://github.com/nytimes/BlendGen',
      loadSidebar: 'components/sidebar.md',
      homepage: 'pages/home-page.md',
      auto2top: true,
      themeColor: '#333333',
      plugins: [
        EditOnGithubPlugin.create('https://github.com/nytimes/BlendGen/tree/dev/docs', 'https://github.com/nytimes/BlendGen/tree/dev/docs', 'Edit on Github')
      ]
    }
    console.log(EditOnGithubPlugin)
  </script>
  <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
</body>

</html>
